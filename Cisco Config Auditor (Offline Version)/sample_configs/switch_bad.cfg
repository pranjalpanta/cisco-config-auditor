!
! switch_bad.cfg
! A deliberately insecure Cisco IOS switch config.
! Layer 2 is wide open: no port security, VLAN 1 native, unused ports up,
! no DHCP snooping, no Dynamic ARP Inspection and no BPDU Guard.
!
hostname Switch-Bad
!
service password-encryption
service timestamps log datetime msec localtime
ip http server
snmp-server community public RW
!
logging buffered 4096
!
interface Vlan1
 description MANAGEMENT
 ip address 192.0.2.10 255.255.255.0
 no ip directed-broadcast
 no shutdown
!
interface GigabitEthernet0/1
 description TRUNK-TO-CORE
 switchport trunk encapsulation dot1q
 switchport mode trunk
 no shutdown
!
interface FastEthernet0/1
 description USER-PORT
 switchport mode access
 switchport access vlan 10
 no shutdown
!
interface FastEthernet0/2
 description USER-PORT
 switchport mode access
 switchport access vlan 10
 no shutdown
!
interface FastEthernet0/3
 description USER-PORT
 switchport mode access
 switchport access vlan 10
 no shutdown
!
interface FastEthernet0/10
 description UNUSED - patch panel
 switchport mode access
 switchport access vlan 10
 no shutdown
!
interface FastEthernet0/11
 description UNUSED - patch panel
 switchport mode access
 switchport access vlan 10
 no shutdown
!
interface FastEthernet0/12
 description SPARE - meeting room
 switchport mode access
 switchport access vlan 10
 no shutdown
!
line con 0
 password cisco
 login
!
line vty 0 4
 transport input telnet
 password cisco
 login
!
end
