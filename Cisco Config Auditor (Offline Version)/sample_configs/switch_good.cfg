!
! switch_good.cfg
! A bonus reference config: the same switch, but properly hardened.
! All addresses and hashes are fake examples.
!
hostname Switch-Good
!
banner motd ^C
**************************************************************
*  Authorised access only. All activity is monitored/logged. *
**************************************************************
^C
!
service password-encryption
service timestamps debug datetime msec localtime
service timestamps log datetime msec localtime
no service tcp-small-servers
no service udp-small-servers
!
aaa new-model
aaa authentication login default group tacacs+ local
aaa authorization exec default group tacacs+ local
aaa accounting exec default start-stop group tacacs+
!
enable secret 9 $9$EXAMPLEHASHONLY$DoNotUseThisHash
!
username admin privilege 15 secret 9 $9$EXAMPLEHASHONLY$AdminHash
!
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
no ip http server
no ip http secure-server
no ip source-route
no ip finger
no ip bootp server
no cdp run
!
ip access-list standard MGMT-ACCESS
 permit 192.0.2.0 0.0.0.255
!
snmp-server group AUDIT v3 priv
snmp-server user audit AUDIT v3 auth sha AuthPass123 priv aes 128 PrivPass123
snmp-server location DC1-Rack12
snmp-server contact noc@example.com
!
logging host 192.0.2.50
logging source-interface Vlan99
logging buffered 16384 informational
logging trap informational
!
ntp authenticate
ntp authentication-key 1 md5 NtpKey123
ntp trusted-key 1
ntp server 192.0.2.10 key 1
!
vlan 10
 name USERS
vlan 20
 name VOICE
vlan 30
 name SERVERS
vlan 99
 name MGMT
vlan 999
 name UNUSED
!
ip dhcp snooping
ip dhcp snooping vlan 10,20,30
no ip dhcp snooping information option
ip arp inspection vlan 10,20,30
ip arp inspection validate src-mac dst-mac ip
!
spanning-tree portfast default
spanning-tree portfast bpduguard default
vlan dot1q tag native
!
interface Vlan99
 description MANAGEMENT-SVI
 ip address 192.0.2.20 255.255.255.0
 no ip directed-broadcast
 no shutdown
!
interface GigabitEthernet0/1
 description TRUNK-TO-CORE
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20,30,99
 ip dhcp snooping trust
 ip arp inspection trust
 no shutdown
!
interface FastEthernet0/1
 description USER-PORT
 switchport mode access
 switchport access vlan 10
 switchport port-security
 switchport port-security maximum 3
 switchport port-security violation restrict
 switchport port-security mac-address sticky
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
!
interface FastEthernet0/2
 description USER-PORT
 switchport mode access
 switchport access vlan 10
 switchport port-security
 switchport port-security maximum 3
 switchport port-security violation restrict
 switchport port-security mac-address sticky
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
!
interface FastEthernet0/3
 description USER-PORT
 switchport mode access
 switchport access vlan 10
 switchport port-security
 switchport port-security maximum 3
 switchport port-security violation restrict
 switchport port-security mac-address sticky
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
!
interface FastEthernet0/10
 description UNUSED - patch panel
 switchport mode access
 switchport access vlan 999
 shutdown
!
interface FastEthernet0/11
 description UNUSED - patch panel
 switchport mode access
 switchport access vlan 999
 shutdown
!
interface FastEthernet0/12
 description SPARE - meeting room
 switchport mode access
 switchport access vlan 999
 shutdown
!
line con 0
 exec-timeout 10 0
 logging synchronous
 login local
!
line vty 0 4
 access-class MGMT-ACCESS in
 exec-timeout 10 0
 logging synchronous
 login local
 transport input ssh
!
line vty 5 15
 access-class MGMT-ACCESS in
 exec-timeout 10 0
 logging synchronous
 login local
 transport input ssh
!
end
