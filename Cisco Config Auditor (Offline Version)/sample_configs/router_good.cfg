!
! router_good.cfg
! A deliberately well-hardened Cisco IOS router config used by the auditor
! demo. All addresses and hashes are fake examples.
!
hostname Router-Good
!
banner motd ^C
**************************************************************
*  Authorised access only. All activity is monitored/logged. *
**************************************************************
^C
!
service password-encryption
service timestamps debug datetime msec localtime
service timestamps log datetime msec localtime
no service tcp-small-servers
no service udp-small-servers
!
aaa new-model
aaa authentication login default group tacacs+ local
aaa authentication enable default group tacacs+ enable
aaa authorization exec default group tacacs+ local
aaa accounting exec default start-stop group tacacs+
!
enable secret 9 $9$EXAMPLEHASHONLY$DoNotUseThisHash
!
username admin privilege 15 secret 9 $9$EXAMPLEHASHONLY$AdminHash
!
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
no ip http server
no ip http secure-server
no ip source-route
no ip finger
no ip bootp server
no cdp run
!
ip access-list standard MGMT-ACCESS
 permit 192.0.2.0 0.0.0.255
!
snmp-server group AUDIT v3 priv
snmp-server user audit AUDIT v3 auth sha AuthPass123 priv aes 128 PrivPass123
snmp-server location DC1-Rack12
snmp-server contact noc@example.com
!
logging host 192.0.2.50
logging source-interface GigabitEthernet0/0
logging buffered 16384 informational
logging trap informational
!
ntp authenticate
ntp authentication-key 1 md5 NtpKey123
ntp trusted-key 1
ntp server 192.0.2.10 key 1
!
interface GigabitEthernet0/0
 description WAN-LINK
 ip address 203.0.113.2 255.255.255.252
 no ip directed-broadcast
 no ip proxy-arp
 no shutdown
!
interface GigabitEthernet0/1
 description LAN-LINK
 ip address 192.0.2.1 255.255.255.0
 no ip directed-broadcast
 no ip proxy-arp
 no shutdown
!
line con 0
 exec-timeout 10 0
 logging synchronous
 login local
!
line vty 0 4
 access-class MGMT-ACCESS in
 exec-timeout 10 0
 logging synchronous
 login local
 transport input ssh
!
line vty 5 15
 access-class MGMT-ACCESS in
 exec-timeout 10 0
 logging synchronous
 login local
 transport input ssh
!
end
